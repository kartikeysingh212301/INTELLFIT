<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator | IntelliFit</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        .bmi-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; background: #2ecc71; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .result-box { margin-top: 25px; padding: 15px; border-radius: 10px; background: #e8f8f5; border: 2px solid #2ecc71; }
        .category { font-weight: bold; color: #27ae60; font-size: 1.2em; }
        .back-link { margin-top: 20px; text-decoration: none; color: #7f8c8d; font-size: 14px; }
    </style>
</head>
<body>

    <div class="bmi-card">
        <h2 style="color: #2c3e50;">BMI Calculator</h2>
        <form method="POST">
            <label style="float: left;">Height (cm):</label>
            <input type="number" name="height" placeholder="e.g. 170" step="0.1" required>

            <label style="float: left;">Weight (kg):</label>
            <input type="number" name="weight" placeholder="e.g. 65" step="0.1" required>

            <button type="submit">Calculate BMI</button>
        </form>

        {% if bmi %}
        <div class="result-box">
            <p style="margin: 0;">Your BMI is:</p>
            <h1 style="margin: 5px 0; color: #2c3e50;">{{ bmi }}</h1>
            <p class="category">Category: {{ category }}</p>
        </div>
        {% endif %}

        <br>
        <a href="/dashboard" class="back-link">← Back to Dashboard</a>
    </div>

</body>
</html>
