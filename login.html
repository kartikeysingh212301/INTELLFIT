<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/css/style.css">
    <title>Login | IntelliFit</title>
</head>
<body>
    <div class="form-container">
        <h2 style="text-align: center; color: #2c3e50;">Welcome Back</h2>
