<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | IntelliFit</title>
    <style>
        /* INTEGRATED CSS STARTS HERE */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            color: #2ecc71;
            margin-bottom: 25px;
            font-size: 28px;
        }

        label {
            font-weight: 600;
            color: #2c3e50;
            display: block;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box; /* Padding se box bada nahi hoga */
            font-size: 14px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row div {
            flex: 1;
        }

        button {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #27ae60;
        }

        p {
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
        }

        a {
            color: #2ecc71;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Join IntelliFit</h2>

        <form action="/register" method="POST">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="John Doe" required>

            <label>Email Address</label>
            <input type="email" name="email" placeholder="john@example.com" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>

            <div class="row">
                <div>
                    <label>Age</label>
                    <input type="number" name="age" placeholder="21" required>
                </div>
                <div>
                    <label>Gender</label>
                    <select name="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Height (cm)</label>
                    <input type="number" name="height" placeholder="175" required>
                </div>
                <div>
                    <label>Weight (kg)</label>
                    <input type="number" name="weight" placeholder="70" required>
                </div>
            </div>

            <button type="submit">Create Account</button>
        </form>

        <p>Already a member? <a href="/login">Login</a></p>
    </div>

</body>
</html>
